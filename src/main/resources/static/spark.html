<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark查询与分析 - 搜狐搜索日志分析系统</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .section { display: none; }
        .section.active { display: block; }
        .results-summary { margin-bottom: 20px; padding: 16px; background: linear-gradient(135deg, #1a1a1a 0%, #111 100%); border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }
        .show-more-btn { background: #111; color: #fff; border: 1px solid #666; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-top: 10px; font-size: 12px; }
        .show-more-btn:hover { background: #333; color: #fff; border-color: #fff; }
        .result-details { background: #111; border-radius: 6px; padding: 16px; margin-top: 12px; }
        .result-details pre { margin: 0; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="top-nav">
        <div class="nav-left">
            <a href="/">主页</a>
            <a href="/hbase">HBase查询</a>
            <a href="/spark" class="active">Spark查询与分析</a>
        </div>
        <div class="nav-right">
            <button class="shutdown-btn" onclick="shutdownServer()">关闭Dashboard</button>
        </div>
    </div>
    <div class="container">
        <div class="sidebar">
            <h3>功能</h3>
            <a class="sidebar-btn active" data-section="spark-search-section">Spark条件查询</a>
            <a class="sidebar-btn" data-section="spark-analysis-section">Spark统计分析</a>
        </div>
        <div class="main-content">
            <!-- Spark Search Section -->
            <div class="section active" id="spark-search-section">
                <h2>Spark条件查询</h2>
                <div class="section-content">
                    <div class="config-panel">
                        <div class="form-group">
                            <label for="spark-condition">搜索条件:</label>
                            <input type="text" id="spark-condition" placeholder="time:00:00:00|01:00:00 + user:user1">
                        </div>
                    </div>
                    <div class="action-panel">
                        <button onclick="sparkSearch()">查询</button>
                        <div id="spark-result" class="result"></div>
                    </div>
                </div>
            </div>

            <!-- Spark Analysis Section -->
            <div class="section" id="spark-analysis-section">
                <h2>Spark统计分析</h2>
                <div class="section-content">
                    <div class="config-panel">
                        <div class="form-group">
                            <label for="start-time">开始时间:</label>
                            <input type="text" id="start-time" value="00:00:00">
                        </div>
                        <div class="form-group">
                            <label for="end-time">结束时间:</label>
                            <input type="text" id="end-time" value="23:59:59">
                        </div>
                        <div class="form-group">
                            <label for="output-dir">输出目录:</label>
                            <input type="text" id="output-dir" value="output">
                        </div>
                        <div class="form-group">
                            <label for="zk-quorum">ZooKeeper地址:</label>
                            <input type="text" id="zk-quorum" value="localhost">
                        </div>
                        <div class="form-group">
                            <label for="zk-port">ZooKeeper端口:</label>
                            <input type="text" id="zk-port" value="2181">
                        </div>
                    </div>
                    <div class="action-panel">
                        <button onclick="runAnalysis()">执行分析</button>
                        <div id="analysis-result" class="result"></div>
                        <div class="chart-container" id="chart-container" style="display: none;">
                            <canvas id="analysisChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="terminal-container">
        <h2>终端信息</h2>
        <textarea id="terminal" readonly></textarea>
        <button onclick="clearTerminal()">清空终端</button>
    </div>

    <script>
        let chart = null;

          // 全局变量存储Spark查询结果和分页状态
          let sparkResults = [];
          let sparkCurrentPage = 1;
          let sparkPageSize = 20;
          let sparkTotalResults = 0;
          
          async function sparkSearch() {
               const condition = document.getElementById('spark-condition').value;
               if (!condition) {
                   alert('请输入搜索条件');
                   return;
               }
               const btn = event.target;
               const resultDiv = document.getElementById('spark-result');
               btn.disabled = true;
               btn.classList.add('btn-loading');
               resultDiv.innerHTML = '';
               logToTerminal('开始Spark条件查询: ' + condition);
               try {
                   const response = await fetch('/api/search/spark', {
                       method: 'POST',
                       headers: { 'Content-Type': 'application/json' },
                       body: JSON.stringify({ condition: condition })
                   });
                   const data = await response.json();
                   if (data.success) {
                       logToTerminal('Spark条件查询完成: ' + condition);
                        
                       // 存储结果
                       sparkResults = data.results || [];
                       sparkTotalResults = data.count || 0;
                       sparkCurrentPage = 1;
                       
                       // 显示结果
                       displaySparkResults();
                       
                       logToTerminal('Spark条件查询结果: 找到 ' + data.count + ' 条记录');
                   } else {
                       resultDiv.innerHTML = '<span class="error">错误: ' + (data.error || '未知错误') + '</span>';
                       logToTerminal('Spark条件查询错误: ' + (data.error || '未知错误'));
                   }
               } catch (error) {
                   resultDiv.innerHTML = '<span class="error">错误: ' + error.message + '</span>';
                   logToTerminal('Spark条件查询异常: ' + error.message);
               } finally {
                   btn.disabled = false;
                   btn.classList.remove('btn-loading');
               }
          }
          
          function displaySparkResults() {
               const resultDiv = document.getElementById('spark-result');
               if (!sparkResults || sparkResults.length === 0) {
                   let html = '<div class="results-summary">';
                   html += '<strong>查询条件:</strong> 无结果<br>';
                   html += '<strong>结果数量:</strong> 0 条记录<br>';
                   html += '<strong>状态:</strong> 未找到符合条件的记录';
                   html += '</div>';
                   html += '<div class="results-summary" style="background: #330000; border-color: #ff4444;">';
                   html += '<strong>未找到符合条件的记录</strong>';
                   html += '</div>';
                   resultDiv.innerHTML = html;
                   return;
               }
               
               // 计算分页
               const totalPages = Math.ceil(sparkResults.length / sparkPageSize);
               const startIndex = (sparkCurrentPage - 1) * sparkPageSize;
               const endIndex = Math.min(startIndex + sparkPageSize, sparkResults.length);
               const pageResults = sparkResults.slice(startIndex, endIndex);
               
               let html = '';
               html += '<div class="results-summary">';
               html += '<strong>查询条件:</strong> 已查询<br>';
               html += '<strong>结果数量:</strong> ' + sparkResults.length + ' 条记录<br>';
               html += '<strong>状态:</strong> 找到 ' + sparkResults.length + ' 条记录';
               html += '</div>';
               
               html += '<div style="margin-top: 15px;">';
               html += '<table class="results-table">';
               html += '<thead><tr>';
               html += '<th>时间</th><th>用户</th><th>查询词</th><th>排名</th><th>点击顺序</th><th>URL</th><th>域名</th>';
               html += '</tr></thead>';
               html += '<tbody>';
               
               pageResults.forEach((record, index) => {
                   html += '<tr>';
                   html += '<td>' + escapeHtml(record.accessTime || '') + '</td>';
                   html += '<td>' + escapeHtml(record.userId || '') + '</td>';
                   html += '<td>' + escapeHtml(record.query || '') + '</td>';
                   html += '<td>' + escapeHtml(record.rank || '') + '</td>';
                   html += '<td>' + escapeHtml(record.clickOrder || '') + '</td>';
                   html += '<td title="' + escapeHtml(record.url || '') + '" style="word-break: break-all; max-width: 200px;">' + 
                           escapeHtml(record.url || '') + '</td>';
                   html += '<td>' + escapeHtml(record.domain || '') + '</td>';
                   html += '</tr>';
               });
               
               html += '</tbody></table>';
               
               // 分页器
               if (totalPages > 1) {
                   html += '<div class="pagination">';
                   html += '<button onclick="changeSparkPage(1)" ' + (sparkCurrentPage === 1 ? 'disabled' : '') + '>«</button>';
                   html += '<button onclick="changeSparkPage(' + (sparkCurrentPage - 1) + ')" ' + (sparkCurrentPage === 1 ? 'disabled' : '') + '>‹</button>';
                   
                   // 显示页码
                   const startPage = Math.max(1, sparkCurrentPage - 2);
                   const endPage = Math.min(totalPages, startPage + 4);
                   
                   for (let i = startPage; i <= endPage; i++) {
                       html += '<button onclick="changeSparkPage(' + i + ')" ' + (i === sparkCurrentPage ? 'class="active"' : '') + '>' + i + '</button>';
                   }
                   
                   html += '<button onclick="changeSparkPage(' + (sparkCurrentPage + 1) + ')" ' + (sparkCurrentPage === totalPages ? 'disabled' : '') + '>›</button>';
                   html += '<button onclick="changeSparkPage(' + totalPages + ')" ' + (sparkCurrentPage === totalPages ? 'disabled' : '') + '>»</button>';
                   
                   html += '<span class="pagination-info">第 ' + sparkCurrentPage + ' 页 / 共 ' + totalPages + ' 页</span>';
                   html += '<span class="pagination-info">显示 ' + (startIndex + 1) + '-' + endIndex + ' 条 / 共 ' + sparkResults.length + ' 条</span>';
                   html += '</div>';
               }
               
               html += '</div>';
               
               resultDiv.innerHTML = html;
           }
           
           function changeSparkPage(page) {
               if (page < 1 || page > Math.ceil(sparkResults.length / sparkPageSize)) return;
               sparkCurrentPage = page;
               displaySparkResults();
           }

         function showAllResults(btn, startIndex) {
             const hiddenDiv = btn.nextElementSibling;
             const table = btn.previousElementSibling;
             const tbody = table.querySelector('tbody');
             
             hiddenDiv.style.display = 'block';
             const hiddenRows = hiddenDiv.querySelectorAll('tr');
             hiddenRows.forEach(row => {
                 tbody.appendChild(row.cloneNode(true));
             });
             
             btn.style.display = 'none';
             hiddenDiv.style.display = 'none';
         }

         async function runAnalysis() {
            const startTime = document.getElementById('start-time').value;
            const endTime = document.getElementById('end-time').value;
            const outputDir = document.getElementById('output-dir').value;
            const zkQuorum = document.getElementById('zk-quorum').value;
            const zkPort = document.getElementById('zk-port').value;

            const btn = event.target;
            const resultDiv = document.getElementById('analysis-result');
            const chartContainer = document.getElementById('chart-container');
            btn.disabled = true;
            btn.classList.add('btn-loading');
            resultDiv.innerHTML = '';
             chartContainer.style.display = 'none';
             if (chart) {
                 chart.destroy();
                 chart = null;
             }
             logToTerminal('开始Spark统计分析: ' + startTime + ' 到 ' + endTime);
             try {
                const response = await fetch('/api/analysis/stats', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        startTime: startTime,
                        endTime: endTime,
                        outputDir: outputDir,
                        zkQuorum: zkQuorum,
                        zkPort: zkPort
                    })
                });
                const data = await response.json();
                if (data.success) {
                    const taskId = data.taskId;
                    resultDiv.innerHTML = '<span class="success">任务已启动，ID: ' + taskId + '</span><br><div class="progress-bar"><div class="progress-fill" id="progress-fill-' + taskId + '" style="width: 0%;"></div></div><div id="progress-text-' + taskId + '">准备中...</div>';
                    pollTaskStatus(taskId, resultDiv, chartContainer);
                } else {
                    resultDiv.innerHTML = '<span class="error">错误: ' + data.error + '</span>';
                }
            } catch (error) {
                resultDiv.innerHTML = '<span class="error">错误: ' + error.message + '</span>';
            } finally {
                btn.disabled = false;
                btn.classList.remove('btn-loading');
            }
        }

        function displayChart(resultText) {
            // Simple parsing: assume result has lines like "Key: Value"
            const lines = resultText.split('\n');
            const data = {};
            lines.forEach(line => {
                const parts = line.split(':');
                if (parts.length === 2) {
                    const key = parts[0].trim();
                    const value = parseFloat(parts[1].trim());
                    if (!isNaN(value)) {
                        data[key] = value;
                    }
                }
            });
            if (Object.keys(data).length > 0) {
                document.getElementById('chart-container').style.display = 'block';
                const ctx = document.getElementById('analysisChart').getContext('2d');
                chart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: Object.keys(data),
                        datasets: [{
                            label: '统计数据',
                            data: Object.values(data),
                            backgroundColor: 'rgba(102, 126, 234, 0.6)',
                            borderColor: 'rgba(102, 126, 234, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            }
        }

        function pollTaskStatus(taskId, resultDiv, chartContainer) {
            const interval = setInterval(async () => {
                try {
                    const response = await fetch('/api/task/status/' + taskId);
                    const task = await response.json();
                    const progressText = document.getElementById('progress-text-' + taskId);
                    const progressFill = document.getElementById('progress-fill-' + taskId);
                    if (progressText) progressText.textContent = task.progress || task.status;
                    if (progressFill) progressFill.style.width = task.progress || '0%';

                    // 处理控制台输出
                    if (task.output) {
                        const previousOutput = taskOutputMap.get(taskId) || '';
                        if (task.output.length > previousOutput.length) {
                            const newOutput = task.output.slice(previousOutput.length);
                            logToTerminal(newOutput);
                            taskOutputMap.set(taskId, task.output);
                        }
                    }

                    if (task.status === 'completed') {
                        clearInterval(interval);
                        resultDiv.innerHTML = '<span class="success">' + task.result + '</span>';
                        // Try to parse and display chart
                        displayChart(task.result);
                        logToTerminal(task.type + ': ' + task.result);
                        taskOutputMap.delete(taskId);
                    } else if (task.status === 'failed') {
                        clearInterval(interval);
                        resultDiv.innerHTML = '<span class="error">' + task.result + '</span>';
                        taskOutputMap.delete(taskId);
                    }
                } catch (error) {
                    clearInterval(interval);
                    resultDiv.innerHTML = '<span class="error">查询任务状态失败: ' + error.message + '</span>';
                }
            }, 2000); // Poll every 2 seconds
        }

         const taskOutputMap = new Map();
         function logToTerminal(message) {
             const terminal = document.getElementById('terminal');
             terminal.value += '[' + new Date().toLocaleTimeString() + '] ' + message + '\n';
             terminal.scrollTop = terminal.scrollHeight;
         }
         
         function escapeHtml(text) {
             if (!text) return '';
             const div = document.createElement('div');
             div.textContent = text;
             return div.innerHTML;
         }

        // Sidebar navigation
        document.addEventListener('DOMContentLoaded', function() {
            const sidebarButtons = document.querySelectorAll('.sidebar-btn');
            
            // Function to switch section
            function switchSection(sectionId) {
                // Hide all sections
                document.querySelectorAll('.section').forEach(section => {
                    section.classList.remove('active');
                });
                
                // Show selected section
                const selectedSection = document.getElementById(sectionId);
                if (selectedSection) {
                    selectedSection.classList.add('active');
                }
                
                // Update active button
                sidebarButtons.forEach(btn => {
                    btn.classList.remove('active');
                    if (btn.getAttribute('data-section') === sectionId) {
                        btn.classList.add('active');
                    }
                });
            }
            
            // Add click event to sidebar buttons
            sidebarButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const sectionId = this.getAttribute('data-section');
                    switchSection(sectionId);
                });
            });
            
            // Initialize with first section active
            if (sidebarButtons.length > 0) {
                const firstSectionId = sidebarButtons[0].getAttribute('data-section');
                switchSection(firstSectionId);
            }
        });

        function clearTerminal() {
            document.getElementById('terminal').value = '';
        }

        async function shutdownServer() {
            if (!confirm('确定要关闭Dashboard服务器吗？')) {
                return;
            }
            try {
                const response = await fetch('/api/shutdown', {
                    method: 'POST'
                });
                const result = await response.text();
                alert(result);
                document.body.innerHTML = '<div style="text-align: center; padding: 50px;"><h2>Dashboard已关闭</h2></div>';
            } catch (error) {
                alert('关闭失败: ' + error.message);
            }
        }
    </script>
</body>
</html>
